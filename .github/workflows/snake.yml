name: Snake Game

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Gerar a cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Cores do portfólio: cobrinha verde neon sobre o fundo escuro
          outputs: |
            dist/snake.svg?color_snake=#2f6b10&color_dots=#ebedf0,#c8f5a0,#8aff1f,#5cb817,#2f6b10
            dist/snake-dark.svg?palette=github-dark&color_snake=#8aff1f&color_dots=#161b22,#1d3a0c,#2f6b10,#5cb817,#8aff1f

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
